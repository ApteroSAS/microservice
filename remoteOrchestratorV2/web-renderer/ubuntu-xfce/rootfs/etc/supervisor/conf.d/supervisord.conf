[supervisord]
redirect_stderr=true
stopsignal=QUIT
autorestart=true
directory=/root

[group:x]
programs=xvfb,wm,xfce4,x11vnc,novnc

[program:wm]
priority=15
command=/usr/bin/openbox
environment=DISPLAY=":1",HOME="/root",USER="root"

[program:xfce4]
priority=15
directory=%HOME%
command=/usr/bin/xfce4-panel
user=%USER%
environment=DISPLAY=":1",HOME="%HOME%",USER="%USER%"


[program:xvfb]
priority=10
command=/usr/local/bin/xvfb.sh
stopsignal=KILL

[program:x11vnc]
priority=20
command=x11vnc -display :1 -xkb -forever -shared -repeat -capslock

[program:novnc]
priority=25
command=websockify --web /usr/share/novnc 8080 localhost:5900
autorestart=true
