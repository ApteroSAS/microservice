[program:chrome]
environment=HOME="/home/chrome",USER="chrome"
#command=/opt/google/chrome/chrome --no-sandbox --disable-features=Translate --disable-dev-shm-usage %EXT% --start-maximized --force-device-scale-factor=1 --chrome-frame --%MODE% "%URL%"
command=/opt/google/chrome/chrome --no-sandbox --disable-features=Translate --start-maximized --force-device-scale-factor=1
autostart=true
user=chrome
autorestart=true
startsecs=5
stdout_logfile=NONE
stderr_logfile=NONE
