[program:chrome]
environment=HOME="/home/chrome",USER="chrome"
command=/opt/google/chrome/chrome --no-sandbox --lang=en --disable-features=Translate --disable-dev-shm-usage --load-extension=/home/chrome/.config/google-chrome/chrome-virtual-keyboard-master-updated/%ADDITIONAL_EXT% --start-maximized --force-device-scale-factor=1 --chrome-frame --%MODE% "%URL%"
autostart=true
user=chrome
autorestart=true
startsecs=5
stdout_logfile=NONE
stderr_logfile=NONE
