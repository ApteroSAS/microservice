[program:chrome]
environment=HOME="/home/chrome",USER="chrome"
command=/opt/google/chrome/chrome --no-sandbox --lang=en --disable-features=Translate --disable-dev-shm-usage --start-maximized --force-device-scale-factor=1 --chrome-frame --kiosk "%URL%"
autostart=true
user=chrome
autorestart=false
startsecs=5
stdout_logfile=/chrome.stdout.log
stderr_logfile=chrome.stderr.log
