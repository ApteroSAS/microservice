<html lang="en">

    <title>Ephemeral</title>

    <meta charset="utf-8">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.js"></script>

    <style>

        body {
            margin: 0;
            background-color: dimgrey;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        html {
            height: 100%;
        }

        #top_bar {
            background-color: #6e84a3;
            color: white;
            font: bold 12px Helvetica;
            padding: 6px 5px 4px 5px;
            border-bottom: 1px outset;
        }

        #status {
            text-align: center;
        }

        #sendCtrlAltDelButton {
            position: fixed;
            top: 0px;
            right: 0px;
            border: 1px outset;
            padding: 5px 5px 4px 5px;
            cursor: pointer;
        }

        #screen {
            flex: 1; /* fill remaining space */
            overflow: hidden;
        }

    </style>

    <script type="module">

      const paramHost = new URL(window.location.href).searchParams.get("host");
      window.service = {
        host: paramHost || window.location.host
      }

      // RFB holds the API to connect and communicate with a VNC server
      import RFB from './core/rfb.js';

      let rfb;
      let desktopName;

      // When this function is called, the server requires
      // credentials to authenticate
      function credentialsAreRequired(e) {
        const password = prompt("Password Required:");
        rfb.sendCredentials({password: password});
      }

      // When this function is called we have received
      // a desktop name from the server
      function updateDesktopName(e) {
        desktopName = e.detail.name;
      }

      // Since most operating systems will catch Ctrl+Alt+Del
      // before they get a chance to be intercepted by the browser,
      // we provide a way to emulate this key sequence.
      function sendCtrlAltDel() {
        rfb.sendCtrlAltDel();
        return false;
      }

      // Show a status text in the top bar
      function status(text) {
        console.log(text);
      }

      // This function extracts the value of one variable from the
      // query string. If the variable isn't defined in the URL
      // it returns the default value instead.
      function readQueryVariable(name, defaultValue) {
        // A URL with a query parameter can look like this:
        // https://www.example.com?myqueryparam=myvalue
        //
        // Note that we use location.href instead of location.search
        // because Firefox < 53 has a bug w.r.t location.search
        const re = new RegExp('.*[?&]' + name + '=([^&#]*)'),
          match = document.location.href.match(re);

        if (match) {
          // We have to decode the URL since want the cleartext value
          return decodeURIComponent(match[1]);
        }

        return defaultValue;
      }

      async function createVM(name, width, height, image, imageParams) {
        return new Promise((resolve, reject) => {
          axios.post("https://" + window.service.host + "/service/remote/orchestrator/create", {
            localSessionID: "none",
            remoteScreenSessionId: name,
            screenSizeX: width,
            screenSizeY: height,
            dockerImage: image,
            imageParams: imageParams
          }).then(async resp => {
            resp = resp.data;
            resolve(resp);
          }).catch(err => {
            console.log(err);
            reject(err);
          });
        });
      }

      function mobileAndTabletCheck() {
        let check = false;
        (function (a) {
          if (/(android|bb\d+|meego).+mobile|avantgo|bada\/|blackberry|blazer|compal|elaine|fennec|hiptop|iemobile|ip(hone|od)|iris|kindle|lge |maemo|midp|mmp|mobile.+firefox|netfront|opera m(ob|in)i|palm( os)?|phone|p(ixi|re)\/|plucker|pocket|psp|series(4|6)0|symbian|treo|up\.(browser|link)|vodafone|wap|windows ce|xda|xiino|android|ipad|playbook|silk/i.test(a) || /1207|6310|6590|3gso|4thp|50[1-6]i|770s|802s|a wa|abac|ac(er|oo|s\-)|ai(ko|rn)|al(av|ca|co)|amoi|an(ex|ny|yw)|aptu|ar(ch|go)|as(te|us)|attw|au(di|\-m|r |s )|avan|be(ck|ll|nq)|bi(lb|rd)|bl(ac|az)|br(e|v)w|bumb|bw\-(n|u)|c55\/|capi|ccwa|cdm\-|cell|chtm|cldc|cmd\-|co(mp|nd)|craw|da(it|ll|ng)|dbte|dc\-s|devi|dica|dmob|do(c|p)o|ds(12|\-d)|el(49|ai)|em(l2|ul)|er(ic|k0)|esl8|ez([4-7]0|os|wa|ze)|fetc|fly(\-|_)|g1 u|g560|gene|gf\-5|g\-mo|go(\.w|od)|gr(ad|un)|haie|hcit|hd\-(m|p|t)|hei\-|hi(pt|ta)|hp( i|ip)|hs\-c|ht(c(\-| |_|a|g|p|s|t)|tp)|hu(aw|tc)|i\-(20|go|ma)|i230|iac( |\-|\/)|ibro|idea|ig01|ikom|im1k|inno|ipaq|iris|ja(t|v)a|jbro|jemu|jigs|kddi|keji|kgt( |\/)|klon|kpt |kwc\-|kyo(c|k)|le(no|xi)|lg( g|\/(k|l|u)|50|54|\-[a-w])|libw|lynx|m1\-w|m3ga|m50\/|ma(te|ui|xo)|mc(01|21|ca)|m\-cr|me(rc|ri)|mi(o8|oa|ts)|mmef|mo(01|02|bi|de|do|t(\-| |o|v)|zz)|mt(50|p1|v )|mwbp|mywa|n10[0-2]|n20[2-3]|n30(0|2)|n50(0|2|5)|n7(0(0|1)|10)|ne((c|m)\-|on|tf|wf|wg|wt)|nok(6|i)|nzph|o2im|op(ti|wv)|oran|owg1|p800|pan(a|d|t)|pdxg|pg(13|\-([1-8]|c))|phil|pire|pl(ay|uc)|pn\-2|po(ck|rt|se)|prox|psio|pt\-g|qa\-a|qc(07|12|21|32|60|\-[2-7]|i\-)|qtek|r380|r600|raks|rim9|ro(ve|zo)|s55\/|sa(ge|ma|mm|ms|ny|va)|sc(01|h\-|oo|p\-)|sdk\/|se(c(\-|0|1)|47|mc|nd|ri)|sgh\-|shar|sie(\-|m)|sk\-0|sl(45|id)|sm(al|ar|b3|it|t5)|so(ft|ny)|sp(01|h\-|v\-|v )|sy(01|mb)|t2(18|50)|t6(00|10|18)|ta(gt|lk)|tcl\-|tdg\-|tel(i|m)|tim\-|t\-mo|to(pl|sh)|ts(70|m\-|m3|m5)|tx\-9|up(\.b|g1|si)|utst|v400|v750|veri|vi(rg|te)|vk(40|5[0-3]|\-v)|vm40|voda|vulc|vx(52|53|60|61|70|80|81|83|85|98)|w3c(\-| )|webc|whit|wi(g |nc|nw)|wmlb|wonu|x700|yas\-|your|zeto|zte\-/i.test(a.substr(0, 4))) check = true;
        })(navigator.userAgent || navigator.vendor || window.opera);
        return check;
      }

      function convertLocal(local) {
        //should return eg en_US.UTF-8
        if (local.indexOf("-") !== -1) {
          //eg en-US
          return local.replace("-", "_") + ".UTF-8";
        } else {
          //eg "fr"
          return local + "_" + local.toUpperCase() + ".UTF-8";
        }
      }

      document.addEventListener("DOMContentLoaded", async function (event) {
        const height = window.document.body.offsetHeight;
        const width = window.document.body.offsetWidth;
        const mobile = mobileAndTabletCheck();
        const rpassword = "" + Math.random();
        const name = "ephemeral-" + Math.random();
        const params = {
          "URL": readQueryVariable('url', "www.aptero.co"),
          "MODE": "kiosk",
          "EXTENSION_LIST": mobile ? "['virtual-keyboard']" : "[]",
          "LANG": readQueryVariable('lang', convertLocal(navigator.language)),
          "LANGUAGE": readQueryVariable('lang', convertLocal(navigator.language)),
          "EPHEMERAL": true,
          "PASSWORD": rpassword
        };
        const vmData = await createVM(name, width, height, undefined, params);

        // Read parameters specified in the URL query string
        // By default, use the host and port of server that served this file
        const host = window.service.host;
        let port = "443";
        const password = rpassword;
        const vmsid = vmData.vmsid;
        const url = vmData.url;

        // | | |         | | |
        // | | | Connect | | |
        // v v v         v v v

        status("Connecting");

        // Build the websocket URL used to connect
        function createRFB() {
          // Creating a new RFB object will start a new connection
          rfb = new RFB(document.getElementById('screen'), url,
            {credentials: {password: password}});

          // Add listeners to important events from the RFB module
          // When this function is called we have
          // successfully connected to a server
          function connectedToServer(e) {
            status("Connected to " + desktopName);
            document.getElementById('loading').height = 0;
            document.getElementById('loading').style = "height:0;";
          }

          rfb.addEventListener("connect", connectedToServer);

          // This function is called when we are disconnected
          function disconnectedFromServer(e) {
            if (e.detail.clean) {
              status("Disconnected");
            } else {
              status("Socket not yet ready - retry");
              setTimeout(() => {
                createRFB();
              }, 500);
            }
          }

          rfb.addEventListener("disconnect", disconnectedFromServer);
          rfb.addEventListener("credentialsrequired", credentialsAreRequired);
          rfb.addEventListener("desktopname", updateDesktopName);

          // Set parameters that can be changed on an active connection
          rfb.viewOnly = readQueryVariable('view_only', false);
          rfb.scaleViewport = readQueryVariable('scale', false);
        }

        createRFB();

        //send heart beat to activate the VM # specific aptero
        fetch("https://" + window.service.host + "/service/remote/orchestrator/heart/beat/" + vmsid);
        setInterval(() => {
          fetch("https://" + window.service.host + "/service/remote/orchestrator/heart/beat/" + vmsid);
        }, 5 * 60 * 60 * 1000)
      });

    </script>
</head>

<body>

</div>-->
<div id="loading"
     style="width: 100%;height: 100%;text-align: center;display: flex;justify-content: center;align-items: center;color: white">
    Loading...
</div>
<div id="screen">
    <!-- This is where the remote screen will appear -->
</div>
</body>
</html>
