user nginx;
worker_processes 1;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types {
        # Existing additional types
        application/wasm wasm;

        # Additional MIME types for PDF.js viewer
        application/javascript js mjs; # Add mjs for JavaScript modules
        application/pdf pdf;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/svg+xml svg svgz;
        application/vnd.ms-fontobject eot;
        application/x-font-ttf ttf;
        font/opentype otf;
        application/x-font-truetype ttf;
        application/x-font-opentype otf;
        application/x-font-woff woff;
        application/x-font-woff2 woff2;
        application/x-web-app-manifest+json webapp;
        text/cache-manifest manifest;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    #tcp_nopush on;

    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/html text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";

    # Server configuration
    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html/;
        index index.html;

        # Specific rules for PDF files in test folder
        location /test/sample-cors.pdf {
            # Add CORS headers to block embedding on other domains
            add_header 'Access-Control-Allow-Origin' 'none';
        }

        location /test/sample-open.pdf {
            # No special rules, allow open access
            try_files $uri $uri/ =404;
        }

        location /test/sample-frame.pdf {
            # Block embedding in frames on other domains
            add_header 'X-Frame-Options' 'SAMEORIGIN';
        }

        # Handle JavaScript files and other static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
            try_files $uri $uri/ =404;
        }

        # Serve /service/pdf-embed-tool/web directly
        location /service/pdf-embed-tool/web/ {
            alias /usr/share/nginx/html/service/pdf-embed-tool/web/;
            try_files $uri $uri/ =404;
        }

        # Handle /service/pdf-embed-tool
        location /service/pdf-embed-tool {
            try_files $uri $uri/ /service/pdf-embed-tool/index.html;
        }
    }

}
